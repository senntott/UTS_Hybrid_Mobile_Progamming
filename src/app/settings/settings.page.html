<ion-header>
  <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Pengaturan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Tampilan</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item lines="none">
        <ion-icon name="moon-outline" slot="start"></ion-icon>

        <ion-label>
          <h2>Mode Gelap</h2>
          <p>Ubah tampilan terang atau gelap.</p>
        </ion-label>

        <ion-toggle
          slot="end"
          [checked]="darkMode"
          (ionChange)="changeTheme($event)">
        </ion-toggle>
      </ion-item>
    </ion-card-content>
  </ion-card>
</ion-content>
