<ion-header>
  <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="profile-card">
    <div class="profile-avatar">
      <ion-icon name="person-outline"></ion-icon>
    </div>

    <ion-card-header>
      <ion-card-title>Bu Marni</ion-card-title>
      <ion-card-subtitle>Pengelola Toko</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-icon name="storefront-outline" slot="start"></ion-icon>
          <ion-label>
            <h2>Nama Toko</h2>
            <p>Toko Makmur Jaya</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="phone-portrait-outline" slot="start"></ion-icon>
          <ion-label>
            <h2>Aplikasi</h2>
            <p>SIMOBILE — Prototipe Kasir</p>
          </ion-label>
        </ion-item>

        <ion-item lines="none">
          <ion-icon name="cloud-offline-outline" slot="start"></ion-icon>
          <ion-label>
            <h2>Mode Penyimpanan</h2>
            <p>Data disimpan di perangkat</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
