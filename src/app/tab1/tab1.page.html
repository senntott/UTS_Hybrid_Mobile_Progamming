<ion-header>
  <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2 class="dashboard-heading">Ringkasan Hari Ini</h2>
  <p class="dashboard-subtitle">Toko Makmur Jaya</p>

  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Jumlah Produk</ion-card-subtitle>
      <ion-card-title>{{ totalProduk }}</ion-card-title>
    </ion-card-header>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Transaksi Hari Ini</ion-card-subtitle>
      <ion-card-title>{{ totalTransaksiHariIni }}</ion-card-title>
    </ion-card-header>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Produk Terlaris Hari Ini</ion-card-subtitle>
      <ion-card-title>{{ produkTerlaris }}</ion-card-title>
    </ion-card-header>
  </ion-card>
</ion-content>
